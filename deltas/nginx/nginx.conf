# Constants Catalog Frontend — nginx server config
# =================================================
# This file is mounted at /etc/nginx/conf.d/default.conf (see ../Dockerfile),
# so it inherits the http-block defaults from the base image's main nginx.conf
# (worker_processes, events, default mime.types, etc.).
#
# Sections, in order:
#   1. MIME types and defaults
#   2. Compression
#   3. Security headers
#   4. Liveness probe (/healthz)
#   5. API proxy with response-buffer tuning
#   6. SSE streaming endpoint(s)
#   7. SPA static serving with long-lived asset caching

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. MIME types and defaults
    # --------------------------
    # The base image already includes mime.types at the http level, but
    # repeating it here makes this config portable (works if the file is ever
    # used standalone) and survives base-image changes that might drop the
    # http-level include.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # Bump body limit for any future endpoint that uploads files (scan-from-tar,
    # bulk config imports, etc.). Today's POST bodies are tiny JSON.
    client_max_body_size 50m;

    # 2. Compression
    # --------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # 3. Security headers
    # -------------------
    # 'always' applies these on every response, including errors. CSP is
    # intentionally omitted — application-specific and easy to misconfigure.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 4. Liveness probe
    # -----------------
    # Cheap endpoint for container healthchecks. Add this to docker-compose.yml:
    #
    #   frontend:
    #     healthcheck:
    #       test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
    #       interval: 10s
    #       timeout: 3s
    #       retries: 5
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 5. API proxy
    # ------------
    # Generic catch-all for the backend. Buffer sizes are bumped so that
    # /api/transform/compare responses (which can carry full file contents in
    # both originalContent and transformedContent fields) and large
    # /api/transform results stay in memory rather than spilling to temp files.
    #
    # NOTE on SSE: the backend can opt out of buffering per-response by
    # setting `X-Accel-Buffering: no` on the response. nginx honors that
    # header automatically — no nginx directive required. The /api/scan/stream
    # block below is an explicit safety net for the well-known streaming
    # endpoint; future SSE endpoints work transparently as long as the
    # backend sends the header.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer tuning: covers responses up to ~256 KB in memory before
        # spilling to temp files. Most transform/compare and scan results fit.
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        # Extended timeouts for long-running scans and transforms (100 min).
        proxy_connect_timeout 6000s;
        proxy_send_timeout 6000s;
        proxy_read_timeout 6000s;
    }

    # 6. SSE streaming endpoint(s)
    # ----------------------------
    # Server-Sent Events require buffering OFF and gzip OFF — nginx must
    # forward each event the instant the backend writes it, and gzip's
    # block-level compression destroys SSE framing.
    #
    # This regex matches any path ending in /stream, so future streaming
    # endpoints (e.g., /api/transform/progress/stream) inherit the right
    # behavior without needing their own location block.
    location ~ ^/api/.+/stream$ {
        proxy_pass http://backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # Same window as the generic /api/ block so SSE doesn't time out
        # before a parallel non-SSE call would.
        proxy_connect_timeout 6000s;
        proxy_send_timeout 6000s;
        proxy_read_timeout 6000s;
    }

    # 7. SPA routing and static assets
    # --------------------------------
    # Long-lived cache for fingerprinted assets (Vite emits hashes in names).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback: serve index.html for any client-side route. Must come last
    # because it's the catch-all for React Router paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
